name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  no-private-files:
    name: No recordings or media
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every tracked file
        run: git ls-files -z | xargs -0 sh scripts/check-no-private-files.sh

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -t .
